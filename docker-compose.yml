version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: euroadmin
      POSTGRES_PASSWORD: europassword
      POSTGRES_DB: eurochamps
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3013:3013"
    environment:
      DATABASE_URL: "postgresql://euroadmin:europassword@db:5432/eurochamps?schema=public"
      NODE_ENV: production
      PORT: 3013
      UPLOAD_DIR: ./public/uploads
    depends_on:
      - db
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
  uploads_data:
